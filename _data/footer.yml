# Footer content is organized in columns, with the first one reserved for social icons (defined in _config.yml).
# You can also add a small print license statement at the bottom.

# Columns (the more you add, the narrower they will be)
columns:
  - description:
    links:
    - text: Kelly's Google Scholar 
      href: https://scholar.google.com/citations?user=51nSyqwAAAAJ&hl=en
      new_window: true
    - text: University of Georgia Home
      href: https://www.uga.edu/
      new_window: true
    - text: UGA Genetics Department
      href: https://www.genetics.uga.edu/
      new_window: true
    - text: UGA Integrated Life Sciences Program
    - href: https://ils.uga.edu/
